[project]
name = "textkit"
version = "0.0.1"
description = "A tiny text utility library — the target of an automated graph-engineering run."
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Tests import `textkit`, which lives under src/. Putting src on the path here
# means the gate runs `uv run pytest -q` with nothing else to configure.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# A tiny library with no runtime deps; the dev group is just pytest. `uv run`
# builds this env from the lockfile, so the gate is hermetic and reproducible.
package = false
